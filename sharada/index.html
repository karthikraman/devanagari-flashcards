<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Quiz App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Grantha Script Quiz</h1>

  <div class="flashcard">
    <div class="front">
      <span id="character"></span>
    </div>
    <div class="back hidden">
      <div class="answer-section">
        <p id="correct-answer"></p>
      </div>
      <div class="context-section">
        <p id="context"></p>
      </div>
    </div>
  </div>

  <div>
    <input type="text" id="user-input" placeholder="Enter translated character">
  </div>

  <div>
    <button onclick="checkAnswer()">Submit Answer</button>
    <button onclick="randomCard()" class="next">Next Question</button>
  </div>

  <div id="status-message" class="status hidden"></div>

  <center>
    <div id="stats" class="stats">
      <div id="score">Score: 0</div>
      <div id="correct">Correct: 0</div>
      <div id="incorrect">Incorrect: 0</div>
      <div id="streak">Streak: 0</div>
    </div>
  </center>
  
  <script src="script.js"></script>
</body>
</html>
